[package]
name = "deboa-compio"
version = "0.1.4"
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/deboa-compio"
homepage = "https://github.com/ararog/deboa"
description = "A friendly rest client on top of hyper."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version = "1.85.0"

[package.metadata.docs.rs]
features = [
  "http1",
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
]

[features]
default = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
]

rust-tls = [
  "compio-tls/rustls",
  "rustls/tls12",
  "dep:rustls-native-certs",
  "dep:webpki-roots",
]

webpki-rustls-verifier = ["__webpki_rustls_verifier"]
platform-rustls-verifier = ["__platform_rustls_verifier"]

default-rustls-verifier = ["__webpki_rustls_verifier"]
__webpki_rustls_verifier = ["dep:webpki-roots"]
__platform_rustls_verifier = ["dep:rustls-platform-verifier"]

# rustls providers
no-provider = []
aws-lc-rustls-provider = ["__rustls_aws_lc_rs"]
ring-rustls-provider = ["__rustls_ring"]

default-rustls-provider = ["__rustls_aws_lc_rs"]
__rustls_aws_lc_rs = ["rustls/aws-lc-rs"]
__rustls_ring = ["rustls/ring"]

# tls implementations
native-tls = ["compio-tls/native-tls"]

# protocols
http1 = ["hyper/http1", "hyper-util/http1"]
http2 = ["hyper/http2", "hyper-util/http2"]
http3 = [
  "deboa-h3/compio",
  "dep:h3",
  "hyper-body-utils/compio-h3",
  "compio-quic/h3",
  "compio-quic/ring",
]

[dependencies]
async-executor = { workspace = true, default-features = false }
async-lock.workspace = true
base64.workspace = true
bytes.workspace = true
compio-quic = { version = "0.8.2", default-features = false, optional = true }
compio-tls = { version = "0.10.0", default-features = false, optional = true }
cookie = { version = "0.18.1" }
cyper-core = "0.9.0"
deboa.workspace = true
deboa-h3 = { version = "0.1.2", optional = true }
futures = { version = "0.3.31", optional = true, default-features = false }
futures-util = { version = "0.3.31", default-features = false }
h3 = { version = "0.0.8", optional = true }
hashbrown.workspace = true
http.workspace = true
http-body = "1"
http-body-util.workspace = true
hyper = { version = "1.8.1", features = ["client"], default-features = false }
hyper-body-utils = { version = ">= 0.1.14", default-features = false }
hyper-util = { version = "0.1.20", features = [
  "client",
  "client-legacy",
], default-features = false }
indexmap = "2.11.4"
io-uring = "0.7.13"
log = "0.4.34"
minimime = "1.0.0"
rand.workspace = true
regex.workspace = true
rustls = { version = "0.23.36", optional = true, default-features = false }
rustls-native-certs = { version = "0.8.0", optional = true, default-features = false }
rustls-pki-types = { version = "1.13.2", optional = true, default-features = false }
rustls-platform-verifier = { version = "0.7.0", optional = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
url.workspace = true
urlencoding = "2.1.3"
webpki-roots = { version = "1.0.6" }

[target.'cfg(target_os = "linux")'.dependencies]
compio = { version = "0.19.2", features = [
  "fs",
  "io",
  "net",
  "runtime",
  "io-uring",
  "macros",
  "time",
  "tls"
], default-features = false }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
compio = { version = "0.19.2", features = [
  "fs",
  "io",
  "net",
  "runtime",
  "polling",
  "macros",
  "time",
  "tls"
], default-features = false }

[dev-dependencies]
caramelo.workspace = true
compio = { version = "0.19.2", default-features = false }
criterion = { version = "0.8.2", features = [
  "html_reports",
  "async",
  "async_smol",
  "async_tokio",
] }
deboa-test-utils = { workspace = true }
easyhttpmock-vetis-compio = { version = "0.1.1", features = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
], default-features = false }
futures-util = { workspace = true }
multer.workspace = true
rstest.workspace = true
time = { version = "0.3.53" }
